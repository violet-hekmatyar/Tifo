server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: south-stand-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:south_stand}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:change_me}
    password: ${MYSQL_PASSWORD:change_me}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

# Production secrets must come from Linux local .env or shell environment.
# Do not create or commit application-prod.yml.

jwt:
  secret: ${JWT_SECRET:change_me_to_long_random_secret}
