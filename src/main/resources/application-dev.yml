server:
  port: 8080

spring:
  main:
    banner-mode: console
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:south_stand}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

logging:
  level:
    root: INFO
    com.southstand: DEBUG

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev_only_change_me_jwt_secret_please_override_in_prod_2026}
      access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:604800}
