spring:
  application:
    name: south-stand-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:south_stand}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: 8080

app:
  version: 0.1.0-SNAPSHOT
  file:
    storage-root: ${APP_FILE_STORAGE_ROOT:uploads}
    public-url-prefix: ${APP_FILE_PUBLIC_URL_PREFIX:/api/public/files}
    max-size-bytes: ${APP_FILE_MAX_SIZE_BYTES:10485760}
    allowed-extensions: ${APP_FILE_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp,gif}
    allowed-content-types: ${APP_FILE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
  security:
    jwt:
      secret: ${JWT_SECRET:dev_only_change_me_jwt_secret_please_override_in_prod_2026}
      access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:604800}

knife4j:
  enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
