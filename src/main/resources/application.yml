spring:
  application:
    name: south-stand-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:south_stand}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: 8080

app:
  version: 0.1.0-SNAPSHOT
  file:
    storage-type: ${APP_FILE_STORAGE_TYPE:LOCAL}
    public-url-prefix: ${APP_FILE_PUBLIC_URL_PREFIX:/api/public/files}
    max-size-bytes: ${APP_FILE_MAX_SIZE_BYTES:10485760}
    allowed-extensions: ${APP_FILE_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp,gif}
    allowed-content-types: ${APP_FILE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
    local:
      storage-root: ${APP_FILE_LOCAL_STORAGE_ROOT:${APP_FILE_STORAGE_ROOT:uploads}}
    aliyun-oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      public-domain: ${ALIYUN_OSS_PUBLIC_DOMAIN:}
    qiniu:
      bucket: ${QINIU_BUCKET:}
      access-key: ${QINIU_ACCESS_KEY:}
      secret-key: ${QINIU_SECRET_KEY:}
      public-domain: ${QINIU_PUBLIC_DOMAIN:}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_BUCKET:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      public-domain: ${MINIO_PUBLIC_DOMAIN:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
  security:
    jwt:
      secret: ${JWT_SECRET:dev_only_change_me_jwt_secret_please_override_in_prod_2026}
      access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:604800}

knife4j:
  enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  experiment:
    enabled: ${RECOMMENDATION_EXPERIMENT_ENABLED:true}
    id: ${RECOMMENDATION_EXPERIMENT_ID:REC_HOME_V1}
    cf-percent: ${RECOMMENDATION_CF_PERCENT:50}
  cf:
    enabled: ${RECOMMENDATION_CF_ENABLED:true}
    base-url: ${RECOMMENDATION_CF_BASE_URL:http://127.0.0.1:8100}
    connect-timeout-ms: ${RECOMMENDATION_CF_CONNECT_TIMEOUT_MS:300}
    read-timeout-ms: ${RECOMMENDATION_CF_READ_TIMEOUT_MS:800}
    weight: ${RECOMMENDATION_CF_WEIGHT:35}
    failure-threshold: ${RECOMMENDATION_CF_FAILURE_THRESHOLD:3}
    cooldown-seconds: ${RECOMMENDATION_CF_COOLDOWN_SECONDS:30}

feed:
  auxiliary-cards:
    enabled: ${FEED_AUXILIARY_CARDS_ENABLED:true}
    max-ratio: ${FEED_AUXILIARY_CARDS_MAX_RATIO:0.20}
    min-gap: ${FEED_AUXILIARY_CARDS_MIN_GAP:3}
